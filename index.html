<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Barn South — Opening Soon</title>
<meta name="description" content="Barn South bike rental, storage and sales — site opening soon.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Fraunces:opsz,wght@9..144,600;9..144,650&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #1F2A22;
    --text: #F4EFE2;
    --text-muted: #C7C4B4;
    --accent: #C1652F;
    --accent-hover: #A6531F;
    --logo-color: #FFDF34;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    text-align: center;
  }
  .wrap { max-width: 480px; }
  .wordmark {
    font-family: 'Anton', 'Impact', sans-serif;
    font-weight: 400;
    font-size: 1.6rem;
    letter-spacing: 0.02em;
    text-transform: uppercase;
    margin-bottom: 40px;
    color: var(--logo-color);
  }
  .wordmark span { color: var(--logo-color); }
  h1 {
    font-family: 'Fraunces', serif;
    font-weight: 620;
    font-size: clamp(2rem, 6vw, 2.6rem);
    line-height: 1.15;
    margin: 0 0 16px;
  }
  p {
    color: var(--text-muted);
    font-size: 1.05rem;
    line-height: 1.6;
    margin: 0 0 32px;
  }
  .btn {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    padding: 13px 24px;
    border-radius: 3px;
    background: var(--accent);
    color: #FBF6EC;
    text-decoration: none;
    font-weight: 600;
    font-size: 0.98rem;
  }
  .btn:hover { background: var(--accent-hover); }
  .icon-wa { width: 18px; height: 18px; flex: none; }
  .ig {
    display: block;
    margin-top: 22px;
    color: var(--text-muted);
    font-size: 0.9rem;
    text-decoration: none;
  }
  .ig:hover { color: var(--text); }
</style>
</head>
<body>
  <div class="wrap">
    <div class="wordmark">Barn<span>South</span></div>
    <h1>We're getting things ready.</h1>
    <p>Our site is under construction. In the meantime, bike rentals, storage and enquiries are still open — just message us on WhatsApp.</p>

      Message us on WhatsApp
    </a>
    <a class="ig" href="https://instagram.com/barnsouthmy" target="_blank" rel="noopener">Follow @barnsouthmy on Instagram</a>

</html>
